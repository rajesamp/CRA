[project]
name = "cra"
version = "0.1.0"
description = "ChangeRiskAdvisor - pre-deployment change-risk advisor agent (Google ADK + Gemini on Vertex AI)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "google-adk>=2.9",
    "gradio>=6.28.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
